<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--ink:#fff7f4;--rose:#f6d3dc;--plum:#4a1f33;--accent:#ffd9c4;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden}
body{font-family:"Inter Display","Inter",sans-serif;color:var(--ink);position:relative}
.serif{font-family:"Caladea","Liberation Serif",serif;font-style:italic;font-weight:400}
.abs{position:absolute;left:0;right:0;text-align:center}
.eyebrow{top:150px;font-size:30px;letter-spacing:.42em;font-weight:500;text-transform:uppercase}
.eyebrow .line{display:inline-block;width:60px;height:2px;background:var(--ink);vertical-align:middle;margin:0 24px;transform-origin:center}
.h1{top:300px;line-height:.92;font-weight:200;font-size:120px;letter-spacing:-.02em}
.h1 .w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 6px}
.h1 .w span{display:inline-block;will-change:transform}
.h1 b{font-weight:800;letter-spacing:-.04em}
.h1 .it{font-size:132px}
.chips{top:1210px;display:flex;flex-direction:column;gap:22px;align-items:flex-start;padding-left:90px}
.chip{display:inline-flex;align-items:center;gap:18px;padding:18px 34px 18px 22px;border-radius:999px;background:rgba(74,31,51,.42);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1.5px solid rgba(255,247,244,.55);font-size:34px;font-weight:500;letter-spacing:.01em;transform-origin:left center;box-shadow:0 20px 60px rgba(60,20,40,.25)}
.chip .dot{width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:0 0 18px var(--accent)}
.big{top:560px;font-size:150px;font-weight:800;letter-spacing:-.045em;line-height:.9}
.big .l{display:block;overflow:hidden;padding:0 10px}
.big .l span{display:inline-block}
.big .l.thin span{font-weight:200;letter-spacing:-.02em}
.cta{top:1540px;display:flex;justify-content:center}
.cta .btn{position:relative;display:inline-flex;align-items:center;gap:22px;padding:34px 62px;border-radius:999px;background:var(--ink);color:var(--plum);font-size:44px;font-weight:700;letter-spacing:-.01em;box-shadow:0 30px 80px rgba(60,20,40,.35)}
.cta .btn .arr{display:inline-block;font-weight:400}
.cta .ring{position:absolute;left:50%;top:50%;width:420px;height:120px;border-radius:999px;border:2px solid var(--ink);transform:translate(-50%,-50%)}
.sub{top:1700px;font-size:30px;letter-spacing:.3em;text-transform:uppercase;font-weight:500;opacity:.9}
.vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 45%, rgba(40,10,25,.42) 100%)}
.topfade{position:absolute;left:0;right:0;top:0;height:760px;background:linear-gradient(rgba(60,20,40,.45),rgba(60,20,40,0))}
.botfade{position:absolute;left:0;right:0;bottom:0;height:700px;background:linear-gradient(rgba(60,20,40,0),rgba(60,20,40,.6))}
.ripple{position:absolute;width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);transform:translate(-50%,-50%)}
.counter{top:1040px;font-size:44px;font-weight:300;letter-spacing:.08em}
.counter b{font-weight:800}
.bar{position:absolute;left:90px;right:90px;top:1140px;height:3px;background:rgba(255,247,244,.3);transform-origin:left center}
.bar i{display:block;height:100%;background:var(--ink);transform-origin:left center}
</style></head>
<body>
<div class="vign" id="vign"></div>
<div class="topfade" id="topfade"></div>
<div class="botfade" id="botfade"></div>

<div class="abs eyebrow" id="eyebrow"><span class="line" id="ln1"></span><span id="eyeTxt">Nová kolekcia</span><span class="line" id="ln2"></span></div>

<div class="abs h1" id="h1">
  <div><span class="w"><span>Tvar,</span></span> <span class="w"><span>ktorý</span></span></div>
  <div><span class="w"><span>chceš</span></span> <span class="w"><span><b>chytiť.</b></span></span></div>
</div>

<div class="abs big" id="big">
  <span class="l"><span>Každá</span></span>
  <span class="l"><span>vlna</span></span>
  <span class="l thin"><span class="serif">sa hýbe</span></span>
  <span class="l thin"><span>so svetlom.</span></span>
</div>

<div class="abs chips" id="chips">
  <div class="chip"><span class="dot"></span>Skulpturálny reliéf</div>
  <div class="chip"><span class="dot"></span>Zamatovo matný povrch</div>
  <div class="chip"><span class="dot"></span>Hviezda každej police</div>
</div>

<div class="abs h1" id="h2" style="top:420px">
  <div><span class="w"><span>Dotyk,</span></span> <span class="w"><span>ktorý</span></span></div>
  <div><span class="w"><span class="serif it">nechceš</span></span> <span class="w"><span><b>pustiť.</b></span></span></div>
</div>

<div class="abs cta" id="cta"><div class="btn"><span class="ring" id="ring"></span><span>Objaviť vázu</span><span class="arr">→</span></div></div>
<div class="abs sub" id="sub">Doprava zdarma · Limitovaná edícia</div>

<div id="ripples"></div>

<script>
// ---- tiny timeline engine: everything is a pure function of t (seconds) ----
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,u)=>a+(b-a)*u;
const E={
  outExpo:u=>u>=1?1:1-Math.pow(2,-10*u),
  outQuint:u=>1-Math.pow(1-u,5),
  inQuint:u=>u*u*u*u*u,
  outBack:u=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(u-1,3)+c*Math.pow(u-1,2);},
  inOutCubic:u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2,
  outElastic:u=>u===0?0:u===1?1:Math.pow(2,-10*u)*Math.sin((u*10-0.75)*(2*Math.PI/3))+1,
};
// progress of a segment starting at s lasting d, with easing
const seg=(t,s,d,e=E.outExpo)=>e(clamp((t-s)/d,0,1));
const q=s=>document.querySelector(s), qa=s=>[...document.querySelectorAll(s)];
const $=id=>document.getElementById(id);

const h1Words=qa('#h1 .w span'), h2Words=qa('#h2 .w span'), bigLines=qa('#big .l span'), chips=qa('#chips .chip');

// tap times (seconds) — ripples + micro-pulses sync to these
const TAPS=[2.9,3.35,3.8];
const RIP=$('ripples');
// ripple anchor positions (set after inspecting the video): default near centre of vase
let rippleAt=[{x:640,y:1150},{x:640,y:1150},{x:640,y:1150}];
TAPS.forEach(()=>{const d=document.createElement('div');d.className='ripple';RIP.appendChild(d);});
const rips=qa('.ripple');

function wordsIn(words,t,s,stagger=0.08,dur=0.9,dir=1){
  words.forEach((w,i)=>{const u=seg(t,s+i*stagger,dur,E.outExpo);w.style.transform=`translateY(${(1-u)*110*dir}%) skewY(${(1-u)*-6*dir}deg)`;w.style.opacity=u>0?1:0;});
}
function wordsOut(words,t,s,stagger=0.05,dur=0.5){
  words.forEach((w,i)=>{const u=seg(t,s+i*stagger,dur,E.inQuint);if(u>0){w.style.transform=`translateY(${-u*110}%)`;if(u>=1)w.style.opacity=0;}});
}

function render(t){
  // ambient grading
  $('vign').style.opacity=0.9;
  $('topfade').style.opacity=lerp(0.6,1,seg(t,0,0.6))*(t<6.2?1:lerp(1,0.5,seg(t,6.2,0.8)));
  $('botfade').style.opacity=t<5.5?lerp(0.4,0.9,seg(t,2.4,0.6)):lerp(0.9,1,seg(t,5.5,0.5));

  // eyebrow 0.15 -> 7.6
  const ey=$('eyebrow'); const eu=seg(t,0.15,0.9), eo=seg(t,7.3,0.4,E.inQuint);
  ey.style.opacity=eu*(1-eo);
  ey.style.transform=`translateY(${(1-eu)*-30}px)`;
  ey.style.letterSpacing=`${lerp(0.9,0.42,eu)}em`;
  $('ln1').style.transform=$('ln2').style.transform=`scaleX(${seg(t,0.35,0.8)})`;

  // headline 1: 0.25 in, 2.2 out
  const h1=$('h1'); h1.style.opacity=t<2.9?1:0;
  wordsIn(h1Words,t,0.25,0.09,1.0);
  wordsOut(h1Words,t,2.2,0.05,0.45);

  // chips with taps 2.9/3.35/3.8, out at 5.3
  chips.forEach((c,i)=>{
    const u=seg(t,TAPS[i]-0.05,0.7,E.outBack), o=seg(t,5.2+i*0.06,0.35,E.inQuint);
    c.style.opacity=(t>=TAPS[i]-0.05)?(1-o):0;
    c.style.transform=`translateX(${(1-u)*-60 - o*80}px) scale(${lerp(0.7,1,u)})`;
  });
  // ripples
  rips.forEach((r,i)=>{
    const u=seg(t,TAPS[i],0.9,E.outQuint);
    r.style.left=rippleAt[i].x+'px';r.style.top=rippleAt[i].y+'px';
    r.style.opacity=u>0&&u<1?(1-u)*0.9:0;
    r.style.transform=`translate(-50%,-50%) scale(${lerp(0.3,7,u)})`;
    r.style.borderWidth=`${lerp(4,1,u)}px`;
  });

  // big statement: 3.0 in (top area), out 5.3
  const big=$('big'); const bo=seg(t,5.3,0.4,E.inQuint);
  big.style.opacity=(t>2.9&&bo<1)?1:0;
  bigLines.forEach((l,i)=>{const u=seg(t,3.0+i*0.12,0.9,E.outExpo);l.style.transform=`translateY(${(1-u)*110 - bo*120}%)`;});

  // headline 2: 5.6 in, stays
  const h2=$('h2'); h2.style.opacity=t>5.5?1:0;
  wordsIn(h2Words,t,5.6,0.1,1.0);
  // subtle breathing on h2 bold
  h2.style.transform=`translateY(${Math.sin(t*2)*4}px)`;

  // CTA 6.4 in, pulse
  const cu=seg(t,6.4,0.9,E.outBack);
  const cta=$('cta'); cta.style.opacity=cu;
  const pulse=1+0.025*Math.max(0,Math.sin((t-6.4)*4.2));
  cta.style.transform=`translateY(${(1-cu)*80}px) scale(${lerp(0.6,1,cu)*pulse})`;
  const ru=((t-7.0)%1.4)/1.4; const ringOn=t>7.0;
  $('ring').style.opacity=ringOn?(1-ru)*0.7:0;
  $('ring').style.transform=`translate(-50%,-50%) scale(${1+ru*0.45}, ${1+ru*0.9})`;
  // sub 6.9
  const su=seg(t,6.9,0.8);
  $('sub').style.opacity=su*0.9; $('sub').style.transform=`translateY(${(1-su)*20}px)`;
}
window.render=render;
window.setRipples=(arr)=>{rippleAt=arr;};
render(0);
</script>
</body></html>
